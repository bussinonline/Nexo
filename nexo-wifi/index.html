<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f4f8"><title>Wi-Fi Grátis | NEXO Soluções Digitais</title>
<style>
:root{--page:#f3f4f8;--ink:#222b45;--muted:#68758d;--line:#e0e3e9;--field:#f0f3f9;--blue:#2861e8;--soft:#e8efff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 16px;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.frame{width:min(100%,760px);margin:auto;padding:24px 22px 20px;background:var(--page);border:2px solid #dedfe3;border-radius:42px}
.brand{display:flex;align-items:center;justify-content:center;gap:15px;min-height:72px;margin-bottom:18px;white-space:nowrap}.brand-name{font-size:clamp(27px,5vw,38px);font-weight:700;letter-spacing:-1.5px}.brand-subtitle{color:var(--muted);font-size:clamp(15px,2.8vw,23px)}
.panel{background:#fff;border-radius:40px;padding:34px 24px 24px}.hero{text-align:center}.wifi-large{width:66px;height:58px;color:var(--blue)}h1{margin:17px 0 14px;font-size:clamp(29px,5vw,38px);line-height:1.15;letter-spacing:-1px}.welcome{margin:0;color:var(--muted);font-size:clamp(19px,3.5vw,25px)}
.rule{height:2px;border:0;background:var(--line);margin:48px 0 50px}.field-label{display:block;margin:0 0 12px;color:var(--muted);font-size:clamp(17px,3vw,22px)}.field{min-height:86px;padding:18px 25px;border-radius:25px;background:var(--field);display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.field-value{min-width:0;color:#111;font-size:clamp(20px,3.5vw,29px);font-weight:600;overflow-wrap:anywhere}.field-icon{flex:0 0 auto;width:32px;height:32px;color:var(--blue)}
button{cursor:pointer}.copy-button{width:100%;min-height:88px;margin:14px 0 29px;border:0;border-radius:25px;background:var(--blue);color:#fff;font-size:clamp(22px,4vw,30px);font-weight:600}.instructions{padding:30px 25px 25px;background:var(--soft);border-radius:25px;color:#354158}.instructions h2{margin:0 0 22px;color:#111;font-size:clamp(21px,3.5vw,28px)}.instructions ol{margin:0;padding-left:28px}.instructions li{padding-left:1px;margin:0 0 20px;font-size:clamp(17px,3vw,23px);line-height:1.35}.instructions li:last-child{margin:0}footer{margin-top:30px;text-align:center;color:var(--muted);font-size:clamp(17px,3vw,23px)}.status{min-height:22px;margin:10px 0 0;text-align:center;color:#23643c;font-size:14px}
.notice{width:min(100%,760px);margin:18px auto;padding:15px;border-radius:14px;background:#fff4db;color:#70551a;font-size:14px;line-height:1.5}
@media(max-width:520px){body{padding:12px 8px}.frame{padding:15px 10px 12px;border-radius:30px}.brand{gap:9px;min-height:58px;margin-bottom:12px}.brand-name{letter-spacing:-1px}.panel{padding:28px 16px 20px;border-radius:30px}.rule{margin:34px 0 35px}.field{min-height:72px;padding:15px 18px;border-radius:20px}.copy-button{min-height:74px;border-radius:20px}.instructions{padding:24px 19px 21px;border-radius:21px}.instructions li{margin-bottom:16px}}
@media(max-width:360px){.brand{gap:7px}.brand-name{font-size:25px}.brand-subtitle{font-size:14px}.field{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<main class="frame">
<header class="brand"><span class="brand-name">NEXO</span><span class="brand-subtitle">SOLUÇÕES DIGITAIS</span></header>
<section class="panel" id="content">
<div class="hero"><svg class="wifi-large" viewBox="0 0 64 56" fill="none" aria-hidden="true"><path d="M3 15C19 -1 45 -1 61 15M13 27C24 16 40 16 51 27M23 39C28 34 36 34 41 39" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="50" r="3.5" fill="currentColor"/></svg><h1>Wi-Fi Grátis</h1><p class="welcome" id="welcome">Carregando informações...</p></div>
<hr class="rule">
<label class="field-label">NOME DA REDE</label><div class="field"><span class="field-value" id="networkName">—</span><svg class="field-icon" viewBox="0 0 32 32" fill="none"><path d="M3 11C10 4 22 4 29 11M8 16C13 11 19 11 24 16M13 21C15 19 17 19 19 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><circle cx="16" cy="26" r="1.8" fill="currentColor"/></svg></div>
<label class="field-label">SENHA DO WI-FI</label><div class="field"><span class="field-value" id="passwordValue">—</span><svg class="field-icon" viewBox="0 0 32 32" fill="none"><rect x="11" y="4" width="17" height="20" rx="4" stroke="currentColor" stroke-width="2.8"/><path d="M21 27H7a3 3 0 0 1-3-3V11" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></div>
<button class="copy-button" id="copyButton">COPIAR SENHA</button><p class="status" id="copyStatus" role="status" aria-live="polite"></p>
<section class="instructions"><h2>Como se conectar?</h2><ol><li>Copie a senha acima.</li><li>Abra as configurações de Wi-Fi do celular.</li><li>Selecione a rede do estabelecimento.</li><li>Digite ou cole a senha e conecte-se.</li></ol></section>
<footer>Tecnologia NEXO Soluções Digitais</footer>
</section></main>
<div class="notice" id="notice" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONFIG_KEY="nexo_wifi_supabase_config";
const config=JSON.parse(localStorage.getItem(CONFIG_KEY)||"null");
const params=new URLSearchParams(location.search),slug=params.get("loja");
const notice=document.getElementById("notice");
function showError(message){notice.hidden=false;notice.textContent=message;document.getElementById("welcome").textContent="Acesso indisponível";}
async function start(){
 if(!slug){showError("Este link ainda não identifica um estabelecimento. Solicite o link correto à NEXO.");return;}
 if(!config?.url||!config?.key){showError("A página está aguardando a configuração do serviço. Entre em contato com o estabelecimento.");return;}
 if(!window.supabase){showError("Não foi possível carregar o serviço. Tente novamente em instantes.");return;}
 const client=window.supabase.createClient(config.url,config.key);
 const {data,error}=await client.from("wifi_stores").select("business_name,network_name,wifi_password,active").eq("slug",slug).maybeSingle();
 if(error||!data||!data.active){showError("Não encontramos uma rede Wi-Fi ativa neste endereço.");return;}
 document.title="Wi-Fi | "+data.business_name;
 document.getElementById("welcome").textContent="Seja bem-vindo(a) à "+data.business_name+"!";
 document.getElementById("networkName").textContent=data.network_name;
 document.getElementById("passwordValue").textContent=data.wifi_password;
 document.getElementById("copyButton").addEventListener("click",async()=>{
  const status=document.getElementById("copyStatus");
  try{await navigator.clipboard.writeText(data.wifi_password);status.textContent="Senha copiada! Agora conecte-se à rede.";}
  catch(e){status.textContent="Não foi possível copiar automaticamente. Selecione e copie a senha acima.";}
 });
}
start();
</script>
</body></html>
